<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NGDP TECH — Owner Leads</title><link rel="stylesheet" href="/styles.css"></head><body><main class="section"><p class="eyebrow">PRIVATE AREA</p><h1>Owner Lead Dashboard</h1><p class="hero-text">Demo lead pipeline: New → Contacted → Qualified → Closed.</p><div id="leads" class="grid"></div></main><script>
async function load(){const el=document.getElementById('leads');try{const r=await fetch('/api/leads');const leads=await r.json();el.innerHTML=leads.length?leads.map(x=>`<article class="service"><b>${new Date(x.createdAt).toLocaleString()}</b><h3>${x.name}</h3><p>${x.email}</p><p><strong>${x.projectType}</strong></p><p>${String(x.message).replaceAll('<','&lt;')}</p><span>${x.status}</span></article>`).join(''):'<article class="service"><h3>No leads yet</h3><p>New project requests will appear here.</p></article>'}catch(e){el.innerHTML='<article class="service"><h3>Unable to load leads</h3></article>'}}load();
</script></body></html>
